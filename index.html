<style>
/* Layout: Kalpilac-branded phone-first directory. Brand lockup, title bar, route chips, search, expandable doctor cards, bottom sheet forms. */
:root{
  color-scheme:dark;
  --bg:#0B1210; --surface:#131E1A; --surface-2:#182A21; --fg:#EAF3EC; --muted:#8FA397; --line:#22332B;
  --accent:#7BD457; --accent-fg:#08140A; --charcoal:#EAF3EC; --trunk:#D79A7C;
  --leaf-a:#7BD457; --leaf-b:#4FAE3F; --leaf-c:#A5E67F;
  --gave:#D64538; --got:#1E9B58;
  --good:#5FD38D; --warn:#F2B84B; --crit:#FF8A7A;--med:#FF5A4D;
  --good-bg:#123525; --warn-bg:#3A2B0E; --crit-bg:#3E1A17; --chip:#1B2B24; --scrim:rgba(0,0,0,.65);
  --f-head:'Archivo','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:720px;margin:0 auto}

.w1{font-family:var(--f-head);font-stretch:125%;font-weight:800;fill:var(--accent)}
.w2{font-family:var(--f-head);font-stretch:125%;font-weight:700;fill:var(--charcoal)}
.l1{fill:var(--leaf-a)} .l2{fill:var(--leaf-b)} .l3{fill:var(--leaf-c)}
.trunk path,.roots path{fill:none;stroke:var(--trunk);stroke-linecap:round}
.titlebar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
h1{font-family:var(--f-head);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 14px var(--f-body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--crit);font-weight:500}
.btn.sm{padding:6px 10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 24px var(--f-head);font-variant-numeric:tabular-nums;color:var(--accent)}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;flex-direction:column;gap:8px}
input,textarea,select{font:400 15px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips .n{opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
#routes{flex-wrap:wrap;overflow-x:visible;overflow-y:auto;max-height:116px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;padding:14px;cursor:pointer;font:inherit}
.rrow::after{content:"\203A";color:var(--muted);font-size:22px;line-height:1}
.rrow .rt{display:flex;flex-direction:column;min-width:0}
.rrow .rt b{font:700 16px var(--f-head);color:var(--charcoal);overflow-wrap:anywhere}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rhead[hidden]{display:none}
.rhead b{font:700 16px var(--f-head);overflow-wrap:anywhere;color:var(--charcoal)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.head{width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.head .who{min-width:0}
.head b{font-weight:600;display:block;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.body{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.f .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.f .vv{overflow-wrap:anywhere;white-space:pre-wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;overflow-wrap:anywhere}
.none{color:var(--muted);font-size:14px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{font-size:13px;border-left:2px solid var(--line);padding-left:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:22px 16px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.empty b{display:block;color:var(--fg);font-family:var(--f-head);font-size:17px;margin-bottom:4px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.cr{color:var(--crit)} .pos{color:var(--good)}
#sheet h2.cr{color:var(--crit)} #sheet h2.pos{color:var(--good)}
.kpi .v.cr{color:var(--crit)} .kpi .v.pos{color:var(--good)}
.kpis.money .v{font-size:18px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:9px 8px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.tag{border:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;padding:12px 14px;cursor:pointer;font:inherit}
.lrow .rt{display:flex;flex-direction:column;min-width:0}
.meta.comp{color:var(--fg);opacity:.8;font-size:12px;margin-top:2px}
.lrow .rt b{font-weight:600;overflow-wrap:anywhere}
.lamt{text-align:right;font:700 17px var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.lamt small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.vl{display:flex;flex-direction:column;gap:4px}
.vl div{color:var(--med);font-weight:600}
.pname{color:var(--med)}
.prow span{color:var(--med);font-weight:600}
.vl div{background:var(--chip);border-radius:8px;padding:5px 10px;overflow-wrap:anywhere}
.plist,.sugs{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 12px;overflow-wrap:anywhere}
.prow .x{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--crit);border-radius:6px;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}

<body>
<div id="login" hidden><form class="box" id="loginform" autocomplete="on">

<script>
(function(){
  var db=null,user=null;
  var S={docs:[],visits:[],products:[],ledger:[],names:{},showAll:false,selMode:false,selected:{},entMode:false,entSel:{},lmode:'route',lroute:null,orders:[],ostat:'all',omr:'all',oq:'',oopen:null,ordItems:{},ordQ:'',confirmOrd:null,confirmPay:null,ordKeep:[],purchases:[],pparty:null,confirmPur:null,pper:'month',pexp:null,rq:'',sampItems:{},sampQ:'',arr:false,arrIds:{route:[],doctor:[]},view:'doctors',isAdmin:false,pq:'',ptype:'all',lq:'',lv:null,routes:[],route:'all',routesLoaded:false,docsLoaded:false,slow:false,err:'',q:'',scope:'all',open:null,confirmDel:null,myId:null,canWrite:true};
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function today(){return new Date().toLocaleDateString('en-CA');}
  function dayDiff(d){return Math.round((new Date(today()+'T00:00:00')-new Date(d+'T00:00:00'))/86400000);}
  function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
  function ago(n){return n<=0?'Today':n===1?'Yesterday':n+' days ago';}
  function split(s){return String(s||'').split(',').map(function(x){return x.trim();}).filter(Boolean).slice(0,30);}
  function tags(a){return a&&a.length?'<div class="tags">'+a.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>':'<span class="none">Nothing added yet</span>';}
  function ordOf(x){return typeof x.order==='number'?x.order:1e12;}
  var DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  function dayIdx(n){var m=String(n||'').match(/monday|tuesday|wednesday|thursday|friday|saturday|sunday/i);return m?DAYS.indexOf(m[0][0].toUpperCase()+m[0].slice(1).toLowerCase()):7;}
  function rsort(a,b){var d=dayIdx(a.name)-dayIdx(b.name);return d||String(a.name).localeCompare(String(b.name));}
  function byOrder(a,b){var d=ordOf(a)-ordOf(b);return d||String(a.name).localeCompare(String(b.name));}
  function vlist(a){return a&&a.length?'<div class="vl">'+a.map(function(t){return '<div>'+esc(t)+'</div>';}).join('')+'</div>':'<span class="none">Nothing added yet</span>';}
  var tt;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2400);}

  function lastOf(d){
    if(d.lastVisit)return d.lastVisit;
    var v=S.visits.filter(function(x){return x.doctorId===d.id;})[0];
    return v?v.date:null;
  }

  function render(){
    if(S.dragging)return;
    if((S.view==='ledger'||S.view==='team')&&!S.showAll)S.view='doctors';
    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===S.view?'true':'false');});
    $('teamtab').hidden=!S.showAll;
    $('ledgertab').hidden=!S.showAll;
    ['doctors','products','orders','ledger','team'].forEach(function(v){$('v-'+v).hidden=S.view!==v;});
    var cw=!!(db&&S.canWrite);
    $('addbtn').hidden=!(cw&&S.view==='doctors');
    $('routebtn').hidden=!(cw&&S.view==='doctors');
    $('prodbtn').hidden=!(cw&&S.view==='products');
    $('bulkbtn').hidden=!(cw&&S.view==='products');
    $('ordbtn').hidden=!(cw&&S.view==='orders');
    if(S.view==='doctors')renderDoctors();
    else if(S.view==='products')renderProducts();
    else if(S.view==='orders')renderOrders();
    else if(S.view==='ledger')renderLedger();
    else renderTeam();
    renderLedgerDetail();
  }

  var seq=0;
  async function renderDoctors(){
    var my=++seq;
    $('minebtn').hidden=!S.myId;
    document.querySelectorAll('#chips button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.scope===S.scope?'true':'false');});
    var st=$('status');
    if(S.err==='signin'){st.innerHTML='<div class="notice">Sign in to claude.ai and open this page again to see the doctor list. If you do not have access, ask the owner for Contributor access from the Share menu.</div>';$('list').innerHTML='';$('kpis').innerHTML='';return;}
    if(S.err){st.innerHTML='<div class="notice">Could not load the data ('+esc(S.err)+'). Please try again in a while.</div>';$('list').innerHTML='';return;}
    if(!S.docsLoaded){st.innerHTML='<div class="empty">Loading the doctor list'+(S.slow?'. The network seems slow, so what you see may be out of date.':'...')+'</div>';return;}
    st.innerHTML=(!S.canWrite?'<div class="notice">You have view-only access. Ask the owner for Contributor access to add doctors or log visits.</div>':'');

    var all=S.docs.map(function(d){d._last=lastOf(d);d._gap=d._last?dayDiff(d._last):9999;return d;});
    var rmap={};S.routes.forEach(function(r){rmap[r.id]=r;});
    all.forEach(function(d){d._rid=d.routeId&&rmap[d.routeId]?d.routeId:'';});
    var noneCount=all.filter(function(d){return !d._rid;}).length;
    if(S.routesLoaded&&S.route!=='all'&&S.route!=='none'&&!rmap[S.route])S.route='all';
    if(S.route==='none'&&!noneCount)S.route='all';

    else if(S.route==='none'){rb.hidden=false;rb.innerHTML='<b>Doctors with no route</b><span class="acts"><button class="btn ghost sm" data-a="printroute" data-id="none">Print / PDF</button></span>';}
    else rb.hidden=true;
    var rows=all.filter(function(d){return S.route==='all'||(S.route==='none'?!d._rid:d._rid===S.route);});

    renderOcc(all,q);
    var vis=rows.filter(function(d){
      if(S.scope==='mine'&&d.mrId!==S.myId)return false;

      var hay=[d.name,d.speciality,d.town,d.address,d.phone].concat(d.products||[],d.lastSamples||[]).join(' ').toLowerCase();
      return hay.indexOf(q)>=0;
    });
    vis.sort(S.scope==='due'?function(a,b){return b._gap-a._gap;}:byOrder);
    S.arrIds.doctor=vis.map(function(d){return d.id;});
    S.arrIds.route=S.routes.map(function(r){return r.id;});

    var balm=balances();
    var ps={};
    var ids=[];rows.forEach(function(d){if(d.mrId&&ids.indexOf(d.mrId)<0)ids.push(d.mrId);});
    if(user&&ids.length){try{ps=await user.profiles(ids);Object.keys(ps||{}).forEach(function(k){if(ps[k]&&ps[k].name)S.names[k]=ps[k].name;});}catch(e){}}
    if(my!==seq)return;
    function mrName(id){if(!id)return '';if(id===S.myId)return 'You';return (ps[id]&&ps[id].name)||'Another MR';}

    if(S.route==='all'&&!q&&S.scope==='all'&&S.routes.length){
      var items=S.routes.map(function(r){var ds=all.filter(function(d){return d._rid===r.id;});return {id:r.id,name:r.name,n:ds.length,due:ds.filter(function(d){return d._gap>30;}).length};});
      if(noneCount)items.push({id:'none',name:'No route',n:noneCount,due:all.filter(function(d){return !d._rid&&d._gap>30;}).length});
      if(S.rq){var rql=S.rq.toLowerCase();items=items.filter(function(it){return it.name.toLowerCase().indexOf(rql)>=0;});if(!items.length){$('list').innerHTML='<div class="empty">No route matches "'+esc(S.rq)+'".</div>';return;}}
      var lastDay=-1;
      $('list').innerHTML=items.map(function(it){
        var di=it.id==='none'?8:dayIdx(it.name),head='';
        if(di!==lastDay){lastDay=di;head='<div class="dayhead">'+(di<7?DAYS[di]:'Other routes')+'</div>';}
        return head+'<button class="card rrow" data-route="'+esc(it.id)+'"><span class="rt"><b>'+esc(it.name)+'</b><span class="meta">'+it.n+' doctor'+(it.n===1?'':'s')+(it.due?' · '+it.due+' not met in 30+ days':'')+'</span></span></button>';}).join('');
      return;
    }
    if(!rows.length){
      var inRoute=S.route!=='all';
      $('list').innerHTML='<div class="empty"><b>'+(inRoute?'No doctors on this route yet':'No doctors yet')+'</b>'+(S.canWrite?(S.routes.length?'Tap "+ Doctor" above to add one.':'Create your first route with "+ Route", then add doctors with "+ Doctor".'):'Doctors will appear here once MRs add them.')+'</div>';
      return;
    }
    if(!vis.length){$('list').innerHTML='<div class="empty">No doctors match this filter.</div>';return;}

    $('list').innerHTML=vis.map(function(d){
      var cls=d._gap>30?'crit':d._gap>14?'warn':'good';
      var pill=d._last?ago(d._gap):'Never visited';
      var open=S.open===d.id;
      var h='<div class="card"><button class="head" data-a="toggle" data-id="'+esc(d.id)+'" aria-expanded="'+open+'"><div class="who"><b>'+esc(d.name)+'</b><span class="meta">'+esc([d.speciality,d.town].filter(Boolean).join(' · '))+(S.route==='all'&&d._rid?' · Route: '+esc(rmap[d._rid].name):'')+(d.mrId?' · MR: '+esc(mrName(d.mrId)):'')+'</span></div><span class="pill '+cls+'">'+pill+'</span></button>';
      if(open){
        var hist=S.visits.filter(function(v){return v.doctorId===d.id;}).slice(0,6);
        var lastV=hist[0];
        h+='<div class="body">'+
          '<div class="f"><div class="k">Contact</div><div class="phone">'+(d.phone?'<b>'+esc(d.phone)+'</b><button class="btn ghost sm" data-a="copy" data-v="'+esc(d.phone)+'">Copy</button>'+waPdfLink(d):'<span class="none">No number added</span>')+'</div></div>'+
          '<div class="f"><div class="k">Address</div><div class="vv">'+(d.address?esc(d.address):'<span class="none">No address added</span>')+'</div></div>'+
          '<div class="f"><div class="k">Route</div><div class="vv">'+(d._rid?esc(rmap[d._rid].name):'<span class="none">No route selected</span>')+'</div></div>'+
          ((d.dob||d.anniv)?'<div class="f"><div class="k">Birthday / anniversary</div><div class="vv">'+(d.dob?'Birthday: '+esc(dm(d.dob)):'')+(d.dob&&d.anniv?' · ':'')+(d.anniv?'Anniversary: '+esc(dm(d.anniv)):'')+'</div></div>':'')+
          '<div class="f"><div class="k">Products in use</div>'+vlist(d.products)+'</div>'+
          '<div class="f"><div class="k">Last visit</div><div class="vv">'+(d._last?esc(fmt(d._last))+' ('+ago(d._gap)+')':'<span class="none">No visit logged yet</span>')+(lastV&&lastV.note?'<div class="meta">'+esc(lastV.note)+'</div>':'')+'</div></div>'+
          '<div class="f"><div class="k">Samples given last time</div>'+tags(d.lastSamples)+'</div>'+
          (d.notes?'<div class="f"><div class="k">Notes</div><div class="vv">'+esc(d.notes)+'</div></div>':'')+
          (hist.length?'<div class="f"><div class="k">Visit history</div><div class="hist">'+hist.map(function(v){return '<div><b>'+esc(fmt(v.date))+'</b> · '+esc(mrName(v.mrId)||'MR')+'<br><span class="meta">Samples: '+(v.samples&&v.samples.length?esc(v.samples.join(', ')):'none')+(v.note?' · '+esc(v.note):'')+'</span></div>';}).join('')+'</div></div>':'')+
          (S.showAll?'<div class="f"><div class="k">Ledger</div><div class="phone">'+balHtml(balm[d.id]||0)+'<button class="btn ghost sm" data-a="openledger" data-id="'+esc(d.id)+'">Open ledger</button></div></div>':'')+
          (S.canWrite?'<div class="acts"><button class="btn sm" data-a="visit" data-id="'+esc(d.id)+'">Log visit</button><button class="btn ghost sm" data-a="edit" data-id="'+esc(d.id)+'">Edit</button>'+
            (S.confirmDel===d.id?'<button class="btn danger sm" data-a="del" data-id="'+esc(d.id)+'">'+(S.showAll&&ledgerOf(d.id).length?'Confirm delete + '+ledgerOf(d.id).length+' ledger entries?':'Confirm delete?')+'</button>':'<button class="btn danger sm" data-a="askdel" data-id="'+esc(d.id)+'">Delete</button>')+'</div>':'')+
          '</div>';
      }
      h+='</div>';
      return canArr?'<div class="dgi top" data-id="'+esc(d.id)+'"><span class="dh" data-k="doctor" aria-label="Drag to move">⠿</span>'+h+'</div>':h;
    }).join('');

  /* ---------- money, products and ledger ---------- */
  function r2(n){return Math.round(n*100)/100;}
  function rs(n){var v=Math.abs(r2(n));return '₹'+v.toLocaleString('en-IN',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});}
  function byName(a,b){return String(a.name).localeCompare(String(b.name));}
  function ledgerOf(id){return S.ledger.filter(function(e){return e.doctorId===id;});}
  function balances(){var m={};S.ledger.forEach(function(e){m[e.doctorId]=(m[e.doctorId]||0)+(e.kind==='gave'?1:-1)*e.amount;});Object.keys(m).forEach(function(k){m[k]=r2(m[k]);});return m;}
  function balHtml(b){return b>0?'<b class="cr">You will get '+rs(b)+'</b>':b<0?'<b class="pos">You will give '+rs(b)+'</b>':'<span class="none">Settled</span>';}
  function usage(name){var k=String(name).trim().toLowerCase();return S.docs.filter(function(d){return (d.products||[]).some(function(p){return String(p).trim().toLowerCase()===k;});}).length;}
  function numOf(x){var n=parseFloat(String(x).replace(/[^\d.]/g,''));return isNaN(n)?'':r2(n);}
  function isMoney(x){return /^[₹\s]*\d[\d,]*(\.\d+)?$/.test(x);}
  function initials(n){var w=String(n).replace(/^dr\.?\s+/i,'').trim().split(/\s+/);return ((w[0]||'?').charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase();}
  function waNumber(p){var d=String(p||'').replace(/\D/g,'');if(d.length===10)return '91'+d;if(d.length===11&&d.charAt(0)==='0')return '91'+d.slice(1);if(d.length===12&&d.indexOf('91')===0)return d;return '';}
  function sortedEntries(id){return ledgerOf(id).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);});}
  function statement(d){
    var run=0,lines=[];
    sortedEntries(d.id).forEach(function(e){run+=(e.kind==='gave'?1:-1)*e.amount;lines.push(fmt(e.date)+' | '+(e.kind==='gave'?'Gave ':'Received ')+rs(e.amount)+' | Balance '+rs(run)+(run<0?' (advance)':'')+(e.note?' | '+e.note:''));});
    var b=r2(run);
    return 'Kalpilac Pharmaceuticals - Ledger statement\n'+d.name+'\nDate: '+fmt(today())+'\n\n'+(lines.length?lines.join('\n'):'No entries yet')+'\n\n'+(b>0?'Balance due: '+rs(b):b<0?'Advance with us: '+rs(b):'Settled');
  }

  function renderProducts(){
    if(S.err){$('plist').innerHTML='<div class="notice">'+(S.err==='signin'?'Sign in to claude.ai and open this page again to see the product list.':'Could not load the data. Please try again in a while.')+'</div>';$('pkpis').innerHTML='';$('ptypes').innerHTML='';return;}
    var list=S.products.slice().sort(byName);

    var q=S.pq.toLowerCase();

    }).join('');
  }


  function pKey(n){return String(n||'').replace(/\s+/g,' ').trim().toLowerCase();}
  function partyGroups(){
    var m={};
    S.purchases.forEach(function(e){var k=pKey(e.party);if(!k)return;var g=m[k]=m[k]||{key:k,name:e.party,es:[],bought:0,paid:0,last:''};g.es.push(e);if(e.kind==='paid')g.paid+=Number(e.amount)||0;else g.bought+=Number(e.amount)||0;if(String(e.date)>=g.last){g.last=String(e.date);g.name=e.party;}});
    return Object.keys(m).map(function(k){var g=m[k];g.bought=r2(g.bought);g.paid=r2(g.paid);g.bal=r2(g.bought-g.paid);return g;});
  }
  function renderBuy(){
    var gs=partyGroups(),tb=0,tp=0,give=0;
    gs.forEach(function(g){tb+=g.bought;tp+=g.paid;if(g.bal>0)give+=g.bal;});
    $('lkpis').innerHTML='<div class="kpi"><div class="l">You will give</div><div class="v cr">'+rs(r2(give))+'</div></div><div class="kpi"><div class="l">Total purchased</div><div class="v">'+rs(r2(tb))+'</div></div><div class="kpi"><div class="l">Total paid</div><div class="v pos">'+rs(r2(tp))+'</div></div>';
    var q=S.lq.toLowerCase();
    var cur=S.pparty?gs.filter(function(g){return g.key===S.pparty;})[0]:null;
    if(S.pparty&&!cur)S.pparty=null;
    if(cur){
      $('lbar').innerHTML='<div class="lbar"><button class="btn ghost sm" data-a="pback">‹ All parties</button><b>'+esc(cur.name)+'</b><span class="cnt" style="text-align:right">'+(cur.bal>0?'To give ':cur.bal<0?'Advance ':'Settled ')+rs(Math.abs(cur.bal))+'</span></div><div class="lvacts"><button class="btn" data-a="buyadd" data-k="bought" data-id="'+esc(cur.key)+'">+ Purchase</button><button class="btn ghost" data-a="buyadd" data-k="paid" data-id="'+esc(cur.key)+'">+ Payment made</button></div>';
      var es=cur.es.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))||((a.ts||0)-(b.ts||0));}),run=0;
      es.forEach(function(e){run+=(e.kind==='paid'?-1:1)*(Number(e.amount)||0);e._bal=r2(run);});
      $('llist').innerHTML='<div class="entries-h"><span>Entries ('+es.length+')</span><span>Purchase</span><span>Paid</span></div>'+es.slice().reverse().map(function(e){
        var pu=e.kind!=='paid',nt=[e.billNo?'Bill '+e.billNo:'',e.mode||'',e.note||''].filter(Boolean).join(' · ');
        return '<button class="ent" data-a="editpur" data-id="'+esc(e.id)+'"><span class="info"><span class="d">'+esc(fmt(e.date))+'</span><span class="bal'+(e._bal>0?'':' pos')+'">Bal. '+rs(e._bal)+(e._bal<0?' advance':'')+'</span>'+(nt?'<span class="nt">'+esc(nt)+'</span>':'')+'</span><span class="c'+(pu?' gave':'')+'">'+(pu?rs(e.amount):'')+'</span><span class="c'+(pu?'':' got')+'">'+(pu?'':rs(e.amount))+'</span></button>';}).join('');
      return;
    }
    $('lbar').innerHTML='<div class="lvacts"><button class="btn" data-a="buyadd" data-k="bought" data-id="">+ Purchase</button><button class="btn ghost" data-a="buyadd" data-k="paid" data-id="">+ Payment made</button></div>';
    var list=gs.filter(function(g){return !q||g.name.toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return b.bal-a.bal||a.name.localeCompare(b.name);});
    if(!gs.length){$('llist').innerHTML='<div class="empty"><b>No company purchases yet</b>Tap "+ Purchase" to add the first one. Write the party (company or supplier) name, date, bill number and amount.</div>';return;}
    if(!list.length){$('llist').innerHTML='<div class="empty">No party matches.</div>';return;}
    $('llist').innerHTML=list.map(function(g){
      return '<button class="card lrow" data-a="pparty" data-id="'+esc(g.key)+'"><span class="rt"><b>'+esc(g.name)+'</b><span class="meta">'+g.es.length+' entr'+(g.es.length===1?'y':'ies')+' · last '+esc(fmt(g.last))+'</span></span><span class="lamt '+(g.bal>0?'cr':'')+'">'+rs(Math.abs(g.bal))+'<small>'+(g.bal>0?'You will give':g.bal<0?'Advance paid':'Settled')+'</small></span></button>';}).join('');
  }

    if(e){kind=e.kind==='paid'?'paid':'bought';}

    var paid=kind==='paid';
    S.confirmPur=null;
    sheet.innerHTML='<h2 class="'+(paid?'pos':'cr')+'">'+(e?'Edit entry':(paid?'Payment made':'New purchase'))+'</h2><p class="meta" style="margin:0 0 10px">'+(paid?'Money you paid to the party':'Goods you bought from the party')+'</p>'+
      '<form data-form="pur" data-pk="'+(paid?'paid':'bought')+'" data-id="'+esc(eid||'')+'">'+
      '<label>Party name (company or supplier)<input id="b-party" list="dl-party2" maxlength="80" required value="'+esc(pname)+'" placeholder="Type or select the party name" autocomplete="off"></label><datalist id="dl-party2">'+gs.map(function(g){return '<option value="'+esc(g.name)+'">';}).join('')+'</datalist>'+
      '<label>Date<input id="b-date" type="date" required max="'+today()+'" value="'+esc(e?e.date:today())+'"></label>'+
      (paid?'<label>Mode<select id="b-mode">'+['Cash','UPI','Cheque','Bank transfer'].map(function(m){return '<option'+(e&&e.mode===m?' selected':'')+'>'+m+'</option>';}).join('')+'</select></label>':'<label>Bill / invoice number<input id="b-bill" maxlength="40" placeholder="for example: INV-2411-087" value="'+esc(e?e.billNo||'':'')+'" autocomplete="off"></label>')+
      '<label>Amount (₹)<input id="b-amt" type="number" inputmode="decimal" min="0.01" step="0.01" required value="'+(e?esc(e.amount):'')+'"></label>'+

    sheetWrap.hidden=false;setTimeout(function(){var f=$(e||pname?'b-amt':'b-party');if(f)f.focus();},30);
  }
  function renderLedger(){
    if(S.err){$('llist').innerHTML='<div class="notice">Could not load the data. Please try again in a while.</div>';return;}
    if(!S.docsLoaded){$('llist').innerHTML='<div class="empty">Loading...</div>';return;}
    var rmap={};S.routes.forEach(function(r){rmap[r.id]=r;});
    var balm=balances(),get=0,give=0,dues=0;
    var rows=S.docs.map(function(d){var b=balm[d.id]||0;if(b>0){get+=b;dues++;}else if(b<0)give+=-b;return {d:d,b:b,n:ledgerOf(d.id).length};});
    $('lkpis').innerHTML='<div class="kpi"><div class="l">You will get</div><div class="v cr">'+rs(get)+'</div></div><div class="kpi"><div class="l">You will give</div><div class="v pos">'+rs(give)+'</div></div><div class="kpi"><div class="l">Doctors with dues</div><div class="v">'+dues+'</div></div>';
    $('lmodes').innerHTML='<button data-a="lmode" data-id="route" aria-pressed="'+(S.lmode==='route')+'">Route-wise due</button><button data-a="lmode" data-id="all" aria-pressed="'+(S.lmode==='all')+'">All doctors</button>'+(S.isAdmin?'<button data-a="lmode" data-id="buy" aria-pressed="'+(S.lmode==='buy')+'">Company purchases</button>':'');
    if(S.lmode==='buy'&&!S.isAdmin)S.lmode='route';
    $('lq').placeholder=S.lmode==='buy'?'Search party':'Search doctor';
    if(S.lmode==='buy'){renderBuy();return;}
    var q=S.lq.toLowerCase();
    if(S.lmode==='route'&&!S.lroute){
      $('lbar').innerHTML='';
      var groups={};
      rows.forEach(function(r){var k=(r.d.routeId&&rmap[r.d.routeId])?r.d.routeId:'none';var g=groups[k]=groups[k]||{id:k,name:k==='none'?'No route':rmap[k].name,docs:0,dues:0,due:0,adv:0};g.docs++;if(r.b>0){g.dues++;g.due+=r.b;}else if(r.b<0)g.adv+=-r.b;});
      S.routes.forEach(function(r){if(!groups[r.id])groups[r.id]={id:r.id,name:r.name,docs:0,dues:0,due:0,adv:0};});
      var gl=Object.keys(groups).map(function(k){return groups[k];}).filter(function(g){return !q||g.name.toLowerCase().indexOf(q)>=0;});
      gl.sort(function(a,b){if(b.due!==a.due)return b.due-a.due;return String(a.name).localeCompare(String(b.name));});

  function myName(){return (S.myId&&S.names[S.myId])||(user&&user.name)||'';}
  function mrNames(){var o={};if(myName())o[myName()]=1;Object.keys(S.names).forEach(function(k){if(S.names[k])o[S.names[k]]=1;});S.orders.forEach(function(x){if(x.mrName)o[x.mrName]=1;});return Object.keys(o).sort();}
  function ordTotals(o){var q=0,amt=0;(o.items||[]).forEach(function(i){q+=Number(i.qty)||0;if(i.mrp!==''&&i.mrp!=null&&!isNaN(Number(i.mrp)))amt+=(Number(i.qty)||0)*Number(i.mrp);});return {q:q,amt:r2(amt)};}
  function paidOf(o){var t=0;(o.payments||[]).forEach(function(x){t+=Number(x.amount)||0;});return r2(t);}
  function dueOf(o){return o.status==='done'&&o.billAmount?r2(Number(o.billAmount)-paidOf(o)):0;}
  function ordText(o){
    var t=ordTotals(o);
    return 'Order for '+o.party+'\nMR: '+(o.mrName||'')+'\nDate: '+fmt(o.date)+'\n\n'+(o.items||[]).map(function(i,n){return (n+1)+'. '+i.name+(i.pack?' ('+i.pack+')':'')+' x '+i.qty;}).join('\n')+'\n\nTotal quantity: '+t.q+'\nStatus: '+(o.status==='done'?'Delivered':'Pending')+(o.status==='done'&&o.billNo?'\nBill No: '+o.billNo:'')+(o.note?'\nNote: '+o.note:'');
  }
  function renderOrders(){
    if(S.err){$('olist').innerHTML='<div class="notice">Could not load the data. Please try again in a while.</div>';return;}
    var all=S.orders.slice();
    function cnt(st){return all.filter(function(o){return (o.status==='done'?'done':'new')===st;}).length;}
    $('okpis').innerHTML='<div class="kpi"><div class="l">Pending</div><div class="v">'+cnt('new')+'</div></div><div class="kpi"><div class="l">Delivered</div><div class="v">'+cnt('done')+'</div></div>';
    $('ostats').innerHTML=[['all','All'],['new','Pending'],['done','Delivered'],['due','Payment due']].map(function(x){return '<button data-a="ostat" data-id="'+x[0]+'" aria-pressed="'+(S.ostat===x[0])+'">'+x[1]+'</button>';}).join('');
    var mrs=[];all.forEach(function(o){if(o.mrName&&mrs.indexOf(o.mrName)<0)mrs.push(o.mrName);});mrs.sort();
    if(S.omr!=='all'&&mrs.indexOf(S.omr)<0)S.omr='all';
    $('omrs').innerHTML=mrs.length>1?['all'].concat(mrs).map(function(m){return '<button data-a="omr" data-id="'+esc(m)+'" aria-pressed="'+(S.omr===m)+'">'+(m==='all'?'All MRs':esc(m))+'</button>';}).join(''):'';
    var q=S.oq.toLowerCase();
    var rows=all.filter(function(o){
      if(S.ostat==='due'){if(!(dueOf(o)>0))return false;}else if(S.ostat!=='all'&&(o.status==='done'?'done':'new')!==S.ostat)return false;
      if(S.omr!=='all'&&o.mrName!==S.omr)return false;
      if(!q)return true;
      return [o.party,o.mrName,o.note].concat((o.items||[]).map(function(i){return i.name;})).join(' ').toLowerCase().indexOf(q)>=0;
    });
    if(!all.length){$('olist').innerHTML='<div class="empty"><b>No orders yet</b>'+(S.canWrite?'Tap "+ Order" to take the first order.':'Orders will appear here once MRs add them.')+'</div>';return;}
    if(!rows.length){$('olist').innerHTML='<div class="empty">No orders match this filter.</div>';return;}
    $('olist').innerHTML=rows.map(function(o){
      var t=ordTotals(o),st=o.status==='done'?'done':'new',done=st==='done',open=S.oopen===o.id;
      var h='<div class="card"><button class="head" data-a="otoggle" data-id="'+esc(o.id)+'" aria-expanded="'+open+'"><div class="who"><b>'+esc(o.party)+'</b><span class="meta">'+esc(fmt(o.date))+' · MR: '+esc(o.mrName||'-')+' · '+(o.items||[]).length+' item'+((o.items||[]).length===1?'':'s')+(done&&o.billAmount?(dueOf(o)>0?' · Due '+rs(dueOf(o)):' · Paid'):'')+'</span></div><span class="pill '+(done?'good':'warn')+'">'+(done?'Delivered':'Pending')+'</span></button>';
      if(open){

  function dragPlace(){
    if(!DRG)return;var c=DRG.card,list=$('list');
    var cards=[].slice.call(list.querySelectorAll('.dgi[data-id]')).filter(function(x){return x!==c;});
    c.style.transform='none';
    var cy=DRG.y,cx=DRG.x,nat;
    if(cards.length){
      var fr=cards[0].getBoundingClientRect(),lr=cards[cards.length-1].getBoundingClientRect();
      var grid=cards.some(function(x){return Math.abs(x.getBoundingClientRect().left-fr.left)>20;});
      var tgt=null;
      for(var i=0;i<cards.length;i++){var rr=cards[i].getBoundingClientRect();if(cy>=rr.top&&cy<=rr.bottom&&cx>=rr.left&&cx<=rr.right){tgt=cards[i];break;}}
      if(tgt){
        var tr=tgt.getBoundingClientRect();
        var after=grid?(cx>tr.left+tr.width/2):(cy>tr.top+tr.height/2);
        var precedes=!!(c.compareDocumentPosition(tgt)&Node.DOCUMENT_POSITION_FOLLOWING);
        if(precedes&&after)list.insertBefore(c,tgt.nextElementSibling);
        else if(!precedes&&!after)list.insertBefore(c,tgt);
      }else if(!grid&&cy<fr.top){list.insertBefore(c,cards[0]);}
      else if(!grid&&cy>lr.bottom){var lastEl=cards[cards.length-1];if(lastEl.nextElementSibling!==c)list.insertBefore(c,lastEl.nextElementSibling);}
    }
    c.style.transform='none';nat=c.getBoundingClientRect().top;
    c.style.transform='translateY('+(DRG.y-DRG.grab-nat)+'px)';
  }

  var SCRIPT_URL="https://script.google.com/macros/s/AKfycbzwIbokFw1YbAM8AUmnuvkaxn1bCc_LE5V7rllf_f5lVqGXWQdhRX5kqRPDpZ0MIT8O/exec";
  var KS='kalpilac-sheet-login-v1';

      .then(function(r){return r.json();})
      .catch(function(){throw {code:'unavailable'};})

    return post({op:'all'}).then(function(j){
      var sig=JSON.stringify(j.data);

  function startPoll(){

  function snapOf(coll,flt,ord,lim){
    var rows=Object.keys(cache[coll]||{}).map(function(id){return {id:id,d:cache[coll][id]};});

  function query(coll,flt,ord,lim){

      orderBy:function(f,dir){return query(coll,flt,{f:f,dir:dir||'asc'},lim);},
      limit:function(n){return query(coll,flt,ord,n);},

    doc:function(path){

  async function importBackup(file){

    }catch(e){toast('Import failed: not a valid backup file');}
  }

  function docBlob(){var bin=atob(DOC_B64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
  function dlDoc(){
    var u=URL.createObjectURL(docBlob()),a=document.createElement('a');
    a.href=u;a.download='Kalpilac-Product-List.docx';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000);
  }
  async function shareDoc(){
    try{
      var f=new File([docBlob()],'Kalpilac-Product-List.docx',{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Kalpilac Product List',text:'Kalpilac Pharmaceuticals - product list'});return;}
    }catch(e){if(e&&e.name==='AbortError')return;}
    dlDoc();toast('File downloaded. Attach it in WhatsApp.');
  }


  function pdfUrl(){try{return new URL('Kalpilac-Product-List.docx',location.href).href;}catch(e){return '';}}
  function waPdfLink(d){
    var n=waNumber(d.phone);if(!n)return '';
    var msg='Hello '+d.name+',\nPlease find the Kalpilac Pharmaceuticals product list here:\n'+pdfUrl();
    return '<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+n+'?text='+encodeURIComponent(msg)+'">Send product list</a>';
  }

  async function boot(){
    render();
    await waitForLogin();
    db=sdb;user=makeUser();renderAcct();
    S.showAll=true;
    if(user){try{S.myId=await user.id();var cw=await user.can('data.write');S.canWrite=cw!==false;S.isAdmin=!!(await user.isOwner())||!!(await user.canEdit());}catch(e){}}
    var timer=setTimeout(function(){if(!S.docsLoaded){S.slow=true;render();}},10000);
    db.collection('doctors').onSnapshot(function(snap){
      S.docs=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      S.docsLoaded=true;clearTimeout(timer);render();
    },function(er){S.err=(er&&er.code)||'unavailable';S.docsLoaded=true;render();});
    db.collection('routes').onSnapshot(function(snap){
      S.routes=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;}).sort(rsort);
      S.routesLoaded=true;render();
    },function(er){S.routesLoaded=true;});
    db.collection('products').onSnapshot(function(snap){
      S.products=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      render();
    },function(er){});
    db.collection('purchases').onSnapshot(function(snap){
      S.purchases=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      render();
    },function(er){});
    db.collection('orders').onSnapshot(function(snap){
      S.orders=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;}).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
      render();
    },function(er){});
    db.collection('ledger').onSnapshot(function(snap){
      S.ledger=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;o.amount=Number(o.amount)||0;return o;});
      render();
    },function(er){});
    db.collection('visits').orderBy('date','desc').limit(1000).onSnapshot(function(snap){
      S.visits=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      render();
    },function(er){});
  }
  boot();
})();
