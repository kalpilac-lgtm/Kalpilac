<style>
/* Layout: Kalpilac-branded phone-first directory. Brand lockup, title bar, route chips, search, expandable doctor cards, bottom sheet forms. */
:root{
  color-scheme:dark;
  --bg:#0B1210; --surface:#131E1A; --surface-2:#182A21; --fg:#EAF3EC; --muted:#8FA397; --line:#22332B;
  --accent:#7BD457; --accent-fg:#08140A; --charcoal:#EAF3EC; --trunk:#D79A7C;
  --leaf-a:#7BD457; --leaf-b:#4FAE3F; --leaf-c:#A5E67F;
  --gave:#D64538; --got:#1E9B58;
  --good:#5FD38D; --warn:#F2B84B; --crit:#FF8A7A;--med:#FF5A4D;
  --good-bg:#123525; --warn-bg:#3A2B0E; --crit-bg:#3E1A17; --chip:#1B2B24; --scrim:rgba(0,0,0,.65);
  --f-head:'Archivo','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:720px;margin:0 auto}

.w1{font-family:var(--f-head);font-stretch:125%;font-weight:800;fill:var(--accent)}
.w2{font-family:var(--f-head);font-stretch:125%;font-weight:700;fill:var(--charcoal)}
.l1{fill:var(--leaf-a)} .l2{fill:var(--leaf-b)} .l3{fill:var(--leaf-c)}
.trunk path,.roots path{fill:none;stroke:var(--trunk);stroke-linecap:round}
.titlebar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
h1{font-family:var(--f-head);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 14px var(--f-body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--crit);font-weight:500}
.btn.sm{padding:6px 10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 24px var(--f-head);font-variant-numeric:tabular-nums;color:var(--accent)}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;flex-direction:column;gap:8px}
input,textarea,select{font:400 15px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips .n{opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
#routes{flex-wrap:wrap;overflow-x:visible;overflow-y:auto;max-height:116px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;padding:14px;cursor:pointer;font:inherit}
.rrow::after{content:"\203A";color:var(--muted);font-size:22px;line-height:1}
.rrow .rt{display:flex;flex-direction:column;min-width:0}
.rrow .rt b{font:700 16px var(--f-head);color:var(--charcoal);overflow-wrap:anywhere}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rhead[hidden]{display:none}
.rhead b{font:700 16px var(--f-head);overflow-wrap:anywhere;color:var(--charcoal)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.head{width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.head .who{min-width:0}
.head b{font-weight:600;display:block;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.body{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.f .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.f .vv{overflow-wrap:anywhere;white-space:pre-wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;overflow-wrap:anywhere}
.none{color:var(--muted);font-size:14px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{font-size:13px;border-left:2px solid var(--line);padding-left:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:22px 16px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.empty b{display:block;color:var(--fg);font-family:var(--f-head);font-size:17px;margin-bottom:4px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.cr{color:var(--crit)} .pos{color:var(--good)}
#sheet h2.cr{color:var(--crit)} #sheet h2.pos{color:var(--good)}
.kpi .v.cr{color:var(--crit)} .kpi .v.pos{color:var(--good)}
.kpis.money .v{font-size:18px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:9px 8px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.tag{border:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;padding:12px 14px;cursor:pointer;font:inherit}
.lrow .rt{display:flex;flex-direction:column;min-width:0}
.meta.comp{color:var(--fg);opacity:.8;font-size:12px;margin-top:2px}
.lrow .rt b{font-weight:600;overflow-wrap:anywhere}
.lamt{text-align:right;font:700 17px var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.lamt small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.vl{display:flex;flex-direction:column;gap:4px}
.vl div{color:var(--med);font-weight:600}
.pname{color:var(--med)}
.prow span{color:var(--med);font-weight:600}
.vl div{background:var(--chip);border-radius:8px;padding:5px 10px;overflow-wrap:anywhere}
.plist,.sugs{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 12px;overflow-wrap:anywhere}
.prow .x{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--crit);border-radius:6px;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}
.sug{text-align:left;background:var(--surface);border:1px dashed var(--line);color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;overflow-wrap:anywhere}
.addrow{display:flex;gap:8px;align-items:stretch}
.sech{font:700 16px var(--f-head);color:var(--charcoal);margin:20px 0 8px}
.feeditem{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.feeditem b{font-weight:600;overflow-wrap:anywhere}
.lv{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto}
.lv[hidden]{display:none}
.lvin{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lvtop{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0;z-index:2}
.back{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:0 0 auto}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--accent);display:grid;place-items:center;font:700 15px var(--f-head);flex:0 0 auto}
.lvtop .who{min-width:0}
.lvtop .who b{display:block;font:700 17px var(--f-head);overflow-wrap:anywhere}
.balcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.balcard .t{font-weight:600}
.balcard .amt{font:700 26px var(--f-head);font-variant-numeric:tabular-nums}
.amt.zero{color:var(--muted)}
.lbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.lbar .cnt{color:var(--muted);font-size:13px;flex:1 1 auto}
.lrow .chk+.rt{flex:1 1 auto}
.lrow .chk{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--accent-fg);margin-right:10px}
.lrow.on{border-color:var(--accent)}
.lrow.on .chk{background:var(--accent);border-color:var(--accent)}
.lrow.off{opacity:.45;cursor:default}
.ent.on{border-color:var(--accent)}
.ent .chk{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--accent-fg);margin-bottom:4px}
.ent.on .chk{background:var(--accent);border-color:var(--accent)}
.lvacts{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
a.btn{display:inline-block;text-decoration:none}
.entries-h{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;margin-top:6px}
.entries-h span:nth-child(2){color:var(--crit);text-align:right}
.entries-h span:nth-child(3){color:var(--good);text-align:right}
.ent{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%;text-align:left;color:inherit;padding:0;cursor:pointer;font:inherit;margin-bottom:8px}
.ent .info{padding:10px 12px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.ent .d{font-size:13px;color:var(--muted)}
.ent .bal{font-size:12px;border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums;background:var(--crit-bg);color:var(--crit)}
.ent .bal.pos{background:var(--good-bg);color:var(--good)}
.ent .nt{overflow-wrap:anywhere}
.ent .c{display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font:700 16px var(--f-head);font-variant-numeric:tabular-nums}
.ent .c.gave{background:var(--crit-bg);color:var(--crit)}
.ent .c.got{background:var(--good-bg);color:var(--good)}
.lvbar{position:absolute;left:0;right:0;bottom:0}
.lvfix{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:center}
.lvfix[hidden]{display:none}
.lvfix button{flex:1 1 0;max-width:340px;color:#fff;border:0;border-radius:10px;padding:14px 8px;font:700 15px var(--f-body);letter-spacing:.06em;cursor:pointer}
.lvfix .g1{background:var(--gave)}
.lvfix .g2{background:var(--got)}
#sheetwrap{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheetwrap[hidden]{display:none}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#sheet h2{font:700 18px var(--f-head);margin:0 0 12px;color:var(--charcoal)}
#sheet form{display:flex;flex-direction:column;gap:10px}
#sheet label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
#sheet .hint{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:50;max-width:90%}
#toast[hidden]{display:none}

#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
#login .box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
#login h2{margin:10px 0 4px;font-family:Archivo,sans-serif;font-size:20px}
#login p{margin:0 0 14px;color:var(--muted);font-size:13px}
#login label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
#login input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:16px}
#login .btn{width:100%;margin-top:16px;padding:12px;font-size:15px}
#login .msg{margin-top:12px;font-size:13px;color:var(--crit)}
#login .lg{background:#FDFEFF;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
#login .lg .logo-tree{width:70px}
#acct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
#acct button,#acct label{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0B1210}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="login" hidden><form class="box" id="loginform" autocomplete="on">
  <div class="lg"><div class="logo-tree"></div><div class="logo-word"></div></div>
  <h2>Doctor Book</h2><p id="loginsub">Enter your name and the access key given by the owner.</p>
  <div id="loginfields"><label for="em">Your name</label><input id="em" type="text" autocomplete="name" required>
  <label for="pw">Access key</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Sign in</button></div><div class="msg" id="loginmsg"></div>
</form></div>
<div class="wrap">
  <div class="brandbar">
    <div class="logo-tree" role="img" aria-label="Kalpilac tree logo"></div>
    <div class="logo-word" role="img" aria-label="Kalpilac Pharmaceuticals"></div>
  </div>
  <div class="titlebar">
    <div>
      <h1>Doctor Book</h1>
      <p class="sub">Doctors, products and samples for every MR in one place</p>
    </div>
    <div class="acts">
      <button class="btn ghost" id="routebtn" data-a="addroute" hidden>+ Route</button>
      <button class="btn" id="addbtn" data-a="add" hidden>+ Doctor</button>
      <button class="btn ghost" id="bulkbtn" data-a="bulk" hidden>Bulk add</button>
      <button class="btn" id="prodbtn" data-a="addproduct" hidden>+ Product</button>
    </div>
  </div>
  <div id="acct"></div>
  <nav class="tabs" id="tabs">
    <button data-view="doctors" aria-pressed="true">Doctors</button>
    <button data-view="products" aria-pressed="false">Products</button>
    <button data-view="ledger" aria-pressed="false" id="ledgertab" hidden>Ledger</button>
    <button data-view="team" aria-pressed="false" id="teamtab" hidden>Team</button>
  </nav>
  <section id="v-doctors">
  <div class="kpis" id="kpis"></div>
  <div class="controls">
    <div class="chips" id="routes" aria-label="Routes"></div>
    <div class="rhead" id="routebar" hidden></div>
    <input id="q" type="search" placeholder="Search by doctor, product, town or speciality" autocomplete="off">
    <div class="chips" id="chips">
      <button data-scope="all" aria-pressed="true">All doctors</button>
      <button data-scope="mine" id="minebtn" hidden>My doctors</button>
      <button data-scope="due" aria-pressed="false">Not met in 30+ days</button>
    </div>
  </div>
  <div id="status"></div>
  <div class="list" id="list"></div>
  </section>
  <section id="v-products" hidden>
    <div class="kpis" id="pkpis"></div>
    <div class="controls">
      <input id="pq" type="search" placeholder="Search products by name, type, pack or composition" autocomplete="off">
      <div class="chips" id="ptypes"></div>
    </div>
    <div class="list" id="plist"></div>
  </section>
  <section id="v-ledger" hidden>
    <div class="kpis money" id="lkpis"></div>
    <div class="controls">
      <input id="lq" type="search" placeholder="Search doctor" autocomplete="off">
    </div>
    <div id="lbar"></div>
    <div class="list" id="llist"></div>
  </section>
  <section id="v-team" hidden>
    <div class="kpis" id="tkpis"></div>
    <h2 class="sech">Each MR</h2>
    <div class="list" id="tlist"></div>
    <h2 class="sech">Recent activity</h2>
    <div class="list" id="tfeed"></div>
  </section>
</div>
<div class="lv" id="lv" hidden>
  <div class="lvin" id="lvin"></div>
  <div class="lvfix" id="lvfix"><button class="g1" data-a="gave">YOU GAVE ₹</button><button class="g2" data-a="got">YOU GOT ₹</button></div>
</div>
<div id="sheetwrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
(function(){
  var db=null,user=null;
  var S={docs:[],visits:[],products:[],ledger:[],names:{},showAll:false,selMode:false,selected:{},entMode:false,entSel:{},view:'doctors',isAdmin:false,pq:'',ptype:'all',lq:'',lv:null,routes:[],route:'all',routesLoaded:false,docsLoaded:false,slow:false,err:'',q:'',scope:'all',open:null,confirmDel:null,myId:null,canWrite:true};
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function today(){return new Date().toLocaleDateString('en-CA');}
  function dayDiff(d){return Math.round((new Date(today()+'T00:00:00')-new Date(d+'T00:00:00'))/86400000);}
  function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
  function ago(n){return n<=0?'Today':n===1?'Yesterday':n+' days ago';}
  function split(s){return String(s||'').split(',').map(function(x){return x.trim();}).filter(Boolean).slice(0,30);}
  function tags(a){return a&&a.length?'<div class="tags">'+a.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>':'<span class="none">Nothing added yet</span>';}
  function vlist(a){return a&&a.length?'<div class="vl">'+a.map(function(t){return '<div>'+esc(t)+'</div>';}).join('')+'</div>':'<span class="none">Nothing added yet</span>';}
  var tt;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2400);}

  function lastOf(d){
    if(d.lastVisit)return d.lastVisit;
    var v=S.visits.filter(function(x){return x.doctorId===d.id;})[0];
    return v?v.date:null;
  }

  function render(){
    if((S.view==='ledger'||S.view==='team')&&!S.showAll)S.view='doctors';
    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===S.view?'true':'false');});
    $('teamtab').hidden=!S.showAll;
    $('ledgertab').hidden=!S.showAll;
    ['doctors','products','ledger','team'].forEach(function(v){$('v-'+v).hidden=S.view!==v;});
    var cw=!!(db&&S.canWrite);
    $('addbtn').hidden=!(cw&&S.view==='doctors');
    $('routebtn').hidden=!(cw&&S.view==='doctors');
    $('prodbtn').hidden=!(cw&&S.view==='products');
    $('bulkbtn').hidden=!(cw&&S.view==='products');
    if(S.view==='doctors')renderDoctors();
    else if(S.view==='products')renderProducts();
    else if(S.view==='ledger')renderLedger();
    else renderTeam();
    renderLedgerDetail();
  }

  var seq=0;
  async function renderDoctors(){
    var my=++seq;
    $('minebtn').hidden=!S.myId;
    document.querySelectorAll('#chips button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.scope===S.scope?'true':'false');});
    var st=$('status');
    if(S.err==='signin'){st.innerHTML='<div class="notice">Sign in to claude.ai and open this page again to see the doctor list. If you do not have access, ask the owner for Contributor access from the Share menu.</div>';$('list').innerHTML='';$('kpis').innerHTML='';return;}
    if(S.err){st.innerHTML='<div class="notice">Could not load the data ('+esc(S.err)+'). Please try again in a while.</div>';$('list').innerHTML='';return;}
    if(!S.docsLoaded){st.innerHTML='<div class="empty">Loading the doctor list'+(S.slow?'. The network seems slow, so what you see may be out of date.':'...')+'</div>';return;}
    st.innerHTML=(!S.canWrite?'<div class="notice">You have view-only access. Ask the owner for Contributor access to add doctors or log visits.</div>':'');

    var all=S.docs.map(function(d){d._last=lastOf(d);d._gap=d._last?dayDiff(d._last):9999;return d;});
    var rmap={};S.routes.forEach(function(r){rmap[r.id]=r;});
    all.forEach(function(d){d._rid=d.routeId&&rmap[d.routeId]?d.routeId:'';});
    var noneCount=all.filter(function(d){return !d._rid;}).length;
    if(S.routesLoaded&&S.route!=='all'&&S.route!=='none'&&!rmap[S.route])S.route='all';
    if(S.route==='none'&&!noneCount)S.route='all';
    $('routes').innerHTML='<button data-route="all" aria-pressed="'+(S.route==='all')+'">'+(S.route==='all'?'All routes':'‹ All routes')+'</button>';
    var rb=$('routebar');
    if(rmap[S.route]){rb.hidden=false;rb.innerHTML='<b>Doctors on '+esc(rmap[S.route].name)+'</b>'+(S.canWrite?'<span class="acts"><button class="btn ghost sm" data-a="editroute" data-id="'+esc(S.route)+'">Edit route</button></span>':'');}
    else if(S.route==='none'){rb.hidden=false;rb.innerHTML='<b>Doctors with no route</b>';}
    else rb.hidden=true;
    var rows=all.filter(function(d){return S.route==='all'||(S.route==='none'?!d._rid:d._rid===S.route);});
    var month=today().slice(0,7);
    $('kpis').innerHTML=
      '<div class="kpi"><div class="l">Total doctors</div><div class="v">'+rows.length+'</div></div>'+
      '<div class="kpi"><div class="l">Met this month</div><div class="v">'+rows.filter(function(d){return d._last&&d._last.slice(0,7)===month;}).length+'</div></div>'+
      '<div class="kpi"><div class="l">Not met 30+ days</div><div class="v">'+rows.filter(function(d){return d._gap>30;}).length+'</div></div>';

    var q=S.q.toLowerCase();
    var vis=rows.filter(function(d){
      if(S.scope==='mine'&&d.mrId!==S.myId)return false;
      if(S.scope==='due'&&d._gap<=30)return false;
      if(!q)return true;
      var hay=[d.name,d.speciality,d.town,d.address,d.phone].concat(d.products||[],d.lastSamples||[]).join(' ').toLowerCase();
      return hay.indexOf(q)>=0;
    });
    vis.sort(S.scope==='due'?function(a,b){return b._gap-a._gap;}:function(a,b){return String(a.name).localeCompare(String(b.name));});

    var balm=balances();
    var ps={};
    var ids=[];rows.forEach(function(d){if(d.mrId&&ids.indexOf(d.mrId)<0)ids.push(d.mrId);});
    if(user&&ids.length){try{ps=await user.profiles(ids);Object.keys(ps||{}).forEach(function(k){if(ps[k]&&ps[k].name)S.names[k]=ps[k].name;});}catch(e){}}
    if(my!==seq)return;
    function mrName(id){if(!id)return '';if(id===S.myId)return 'You';return (ps[id]&&ps[id].name)||'Another MR';}

    if(S.route==='all'&&!q&&S.scope==='all'&&S.routes.length){
      var items=S.routes.map(function(r){var ds=all.filter(function(d){return d._rid===r.id;});return {id:r.id,name:r.name,n:ds.length,due:ds.filter(function(d){return d._gap>30;}).length};});
      if(noneCount)items.push({id:'none',name:'No route',n:noneCount,due:all.filter(function(d){return !d._rid&&d._gap>30;}).length});
      $('list').innerHTML=items.map(function(it){return '<button class="card rrow" data-route="'+esc(it.id)+'"><span class="rt"><b>'+esc(it.name)+'</b><span class="meta">'+it.n+' doctor'+(it.n===1?'':'s')+(it.due?' · '+it.due+' not met in 30+ days':'')+'</span></span></button>';}).join('');
      return;
    }
    if(!rows.length){
      var inRoute=S.route!=='all';
      $('list').innerHTML='<div class="empty"><b>'+(inRoute?'No doctors on this route yet':'No doctors yet')+'</b>'+(S.canWrite?(S.routes.length?'Tap "+ Doctor" above to add one.':'Create your first route with "+ Route", then add doctors with "+ Doctor".'):'Doctors will appear here once MRs add them.')+'</div>';
      return;
    }
    if(!vis.length){$('list').innerHTML='<div class="empty">No doctors match this filter.</div>';return;}

    $('list').innerHTML=vis.map(function(d){
      var cls=d._gap>30?'crit':d._gap>14?'warn':'good';
      var pill=d._last?ago(d._gap):'Never visited';
      var open=S.open===d.id;
      var h='<div class="card"><button class="head" data-a="toggle" data-id="'+esc(d.id)+'" aria-expanded="'+open+'"><div class="who"><b>'+esc(d.name)+'</b><span class="meta">'+esc([d.speciality,d.town].filter(Boolean).join(' · '))+(S.route==='all'&&d._rid?' · Route: '+esc(rmap[d._rid].name):'')+(d.mrId?' · MR: '+esc(mrName(d.mrId)):'')+'</span></div><span class="pill '+cls+'">'+pill+'</span></button>';
      if(open){
        var hist=S.visits.filter(function(v){return v.doctorId===d.id;}).slice(0,6);
        var lastV=hist[0];
        h+='<div class="body">'+
          '<div class="f"><div class="k">Contact</div><div class="phone">'+(d.phone?'<b>'+esc(d.phone)+'</b><button class="btn ghost sm" data-a="copy" data-v="'+esc(d.phone)+'">Copy</button>'+waPdfLink(d):'<span class="none">No number added</span>')+'</div></div>'+
          '<div class="f"><div class="k">Address</div><div class="vv">'+(d.address?esc(d.address):'<span class="none">No address added</span>')+'</div></div>'+
          '<div class="f"><div class="k">Route</div><div class="vv">'+(d._rid?esc(rmap[d._rid].name):'<span class="none">No route selected</span>')+'</div></div>'+
          '<div class="f"><div class="k">Products in use</div>'+vlist(d.products)+'</div>'+
          '<div class="f"><div class="k">Last visit</div><div class="vv">'+(d._last?esc(fmt(d._last))+' ('+ago(d._gap)+')':'<span class="none">No visit logged yet</span>')+(lastV&&lastV.note?'<div class="meta">'+esc(lastV.note)+'</div>':'')+'</div></div>'+
          '<div class="f"><div class="k">Samples given last time</div>'+tags(d.lastSamples)+'</div>'+
          (d.notes?'<div class="f"><div class="k">Notes</div><div class="vv">'+esc(d.notes)+'</div></div>':'')+
          (hist.length?'<div class="f"><div class="k">Visit history</div><div class="hist">'+hist.map(function(v){return '<div><b>'+esc(fmt(v.date))+'</b> · '+esc(mrName(v.mrId)||'MR')+'<br><span class="meta">Samples: '+(v.samples&&v.samples.length?esc(v.samples.join(', ')):'none')+(v.note?' · '+esc(v.note):'')+'</span></div>';}).join('')+'</div></div>':'')+
          (S.showAll?'<div class="f"><div class="k">Ledger</div><div class="phone">'+balHtml(balm[d.id]||0)+'<button class="btn ghost sm" data-a="openledger" data-id="'+esc(d.id)+'">Open ledger</button></div></div>':'')+
          (S.canWrite?'<div class="acts"><button class="btn sm" data-a="visit" data-id="'+esc(d.id)+'">Log visit</button><button class="btn ghost sm" data-a="edit" data-id="'+esc(d.id)+'">Edit</button>'+
            (S.confirmDel===d.id?'<button class="btn danger sm" data-a="del" data-id="'+esc(d.id)+'">'+(S.showAll&&ledgerOf(d.id).length?'Confirm delete + '+ledgerOf(d.id).length+' ledger entries?':'Confirm delete?')+'</button>':'<button class="btn danger sm" data-a="askdel" data-id="'+esc(d.id)+'">Delete</button>')+'</div>':'')+
          '</div>';
      }
      return h+'</div>';

  /* ---------- money, products and ledger ---------- */
  function r2(n){return Math.round(n*100)/100;}
  function rs(n){var v=Math.abs(r2(n));return '₹'+v.toLocaleString('en-IN',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});}
  function byName(a,b){return String(a.name).localeCompare(String(b.name));}
  function ledgerOf(id){return S.ledger.filter(function(e){return e.doctorId===id;});}
  function balances(){var m={};S.ledger.forEach(function(e){m[e.doctorId]=(m[e.doctorId]||0)+(e.kind==='gave'?1:-1)*e.amount;});Object.keys(m).forEach(function(k){m[k]=r2(m[k]);});return m;}
  function balHtml(b){return b>0?'<b class="cr">You will get '+rs(b)+'</b>':b<0?'<b class="pos">You will give '+rs(b)+'</b>':'<span class="none">Settled</span>';}
  function usage(name){var k=String(name).trim().toLowerCase();return S.docs.filter(function(d){return (d.products||[]).some(function(p){return String(p).trim().toLowerCase()===k;});}).length;}
  function numOf(x){var n=parseFloat(String(x).replace(/[^\d.]/g,''));return isNaN(n)?'':r2(n);}
  function isMoney(x){return /^[₹\s]*\d[\d,]*(\.\d+)?$/.test(x);}
  function initials(n){var w=String(n).replace(/^dr\.?\s+/i,'').trim().split(/\s+/);return ((w[0]||'?').charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase();}
  function waNumber(p){var d=String(p||'').replace(/\D/g,'');if(d.length===10)return '91'+d;if(d.length===11&&d.charAt(0)==='0')return '91'+d.slice(1);if(d.length===12&&d.indexOf('91')===0)return d;return '';}
  function sortedEntries(id){return ledgerOf(id).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);});}
  function statement(d){
    var run=0,lines=[];
    sortedEntries(d.id).forEach(function(e){run+=(e.kind==='gave'?1:-1)*e.amount;lines.push(fmt(e.date)+' | '+(e.kind==='gave'?'Gave ':'Received ')+rs(e.amount)+' | Balance '+rs(run)+(run<0?' (advance)':'')+(e.note?' | '+e.note:''));});
    var b=r2(run);
    return 'Kalpilac Pharmaceuticals - Ledger statement\n'+d.name+'\nDate: '+fmt(today())+'\n\n'+(lines.length?lines.join('\n'):'No entries yet')+'\n\n'+(b>0?'Balance due: '+rs(b):b<0?'Advance with us: '+rs(b):'Settled');
  }

  var tseq=0;
  async function renderTeam(){
    if(S.err){$('tlist').innerHTML='<div class="notice">Could not load the data. Please try again in a while.</div>';return;}
    if(!S.docsLoaded){$('tlist').innerHTML='<div class="empty">Loading...</div>';return;}
    var my=++tseq,month=today().slice(0,7);
    var ids=[];
    function addId(i){if(i&&ids.indexOf(i)<0)ids.push(i);}
    S.docs.forEach(function(d){addId(d.mrId);});S.visits.forEach(function(v){addId(v.mrId);});S.ledger.forEach(function(e){addId(e.mrId);});
    if(user&&ids.length){try{var ps=await user.profiles(ids);Object.keys(ps||{}).forEach(function(k){if(ps[k]&&ps[k].name)S.names[k]=ps[k].name;});}catch(e){}}
    if(my!==tseq)return;
    function nm(id){return id===S.myId?'You (owner)':(S.names[id]||'MR '+(ids.indexOf(id)+1));}
    var rows=ids.map(function(id){
      var vs=S.visits.filter(function(v){return v.mrId===id;});
      var vm=vs.filter(function(v){return String(v.date).slice(0,7)===month;});
      var last=vs.reduce(function(m,v){return v.date>m?v.date:m;},'');
      var samples=vm.reduce(function(n,v){return n+((v.samples||[]).length);},0);
      return {id:id,docs:S.docs.filter(function(d){return d.mrId===id;}).length,vm:vm.length,samples:samples,last:last};
    }).sort(function(a,b){return b.vm-a.vm;});
    var visitsMonth=rows.reduce(function(n,r){return n+r.vm;},0);
    var stale=S.docs.filter(function(d){var l=lastOf(d);return !l||dayDiff(l)>30;}).length;
    $('tkpis').innerHTML='<div class="kpi"><div class="l">MRs</div><div class="v">'+ids.length+'</div></div><div class="kpi"><div class="l">Visits this month</div><div class="v">'+visitsMonth+'</div></div><div class="kpi"><div class="l">Doctors not met 30+ days</div><div class="v">'+stale+'</div></div>';
    $('tlist').innerHTML=rows.length?rows.map(function(r){
      var gap=r.last?dayDiff(r.last):null;
      return '<div class="card lrow" style="cursor:default"><span class="rt"><b>'+esc(nm(r.id))+'</b><span class="meta">'+r.docs+' doctor'+(r.docs===1?'':'s')+' · '+r.vm+' visit'+(r.vm===1?'':'s')+' this month · '+r.samples+' sample'+(r.samples===1?'':'s')+'</span></span><span class="pill '+(gap===null?'crit':gap>14?'warn':'good')+'">'+(gap===null?'No visits':'Last visit '+ago(gap))+'</span></div>';
    }).join(''):'<div class="empty"><b>No MR activity yet</b>Doctors and visits added by your team will show up here.</div>';
    function key(date,ts){return String(date||'')+'~'+('000000000000000'+(ts||0)).slice(-15);}
    var feed=[];
    S.visits.forEach(function(v){var d=find(v.doctorId);feed.push({k:key(v.date,0),date:v.date,mr:v.mrId,text:'Visited '+(d?d.name:'a doctor'),sub:(v.samples&&v.samples.length?'Samples: '+v.samples.join(', '):'No samples')+(v.note?' · '+v.note:'')});});
    S.ledger.forEach(function(e){var d=find(e.doctorId);feed.push({k:key(e.date,e.ts),date:e.date,mr:e.mrId,text:(e.kind==='gave'?'Gave ':'Received ')+rs(e.amount)+(d?' · '+d.name:''),sub:e.note||''});});
    S.docs.forEach(function(d){if(d.createdAt)feed.push({k:key(d.createdAt,0),date:d.createdAt,mr:d.mrId,text:'Added doctor '+d.name,sub:''});});
    feed.sort(function(a,b){return a.k<b.k?1:a.k>b.k?-1:0;});
    feed=feed.slice(0,30);
    $('tfeed').innerHTML=feed.length?feed.map(function(f){return '<div class="card feeditem"><b>'+esc(f.text)+'</b><span class="meta">'+esc(fmt(f.date))+' · '+esc(nm(f.mr))+(f.sub?' · '+esc(f.sub):'')+'</span></div>';}).join(''):'<div class="empty">No activity yet.</div>';
  }

  document.addEventListener('submit',async function(e){
    if(e.target.id==='loginform')return;
    e.preventDefault();
    var f=e.target,kind=f.dataset.form,id=f.dataset.id;
    var btn=f.querySelector('button[type=submit]');btn.disabled=true;
    function g(i){return $(i).value.trim();}
    try{
      if(kind==='doctor'){
        var pend=$('f-psearch');if(pend&&pend.value.trim())addFormProd(pend.value);
        var data={name:g('f-name'),speciality:g('f-spec'),phone:g('f-phone'),town:g('f-town'),address:g('f-addr'),products:formProds.slice(),notes:g('f-notes'),routeId:g('f-route'),lastVisit:g('f-last'),lastSamples:split(g('f-samp'))};
        var msel=$('f-mr');if(msel&&msel.value)data.mrId=msel.value;
        if(id){await db.doc('doctors/'+id).update(data);}
        else{data.mrId=data.mrId||S.myId||'';data.createdAt=today();var ref=await db.collection('doctors').add(data);S.open=ref.id;S.route=data.routeId||'none';S.scope='all';S.q='';var qi=$('q');if(qi)qi.value='';render();}
        toast('Doctor saved');
      }else if(kind==='route'){
        var nm=g('r-name').replace(/\s+/g,' ');
        var key=nm.toLowerCase();
        var dup=S.routes.filter(function(r){return r.id!==id&&String(r.name).trim().toLowerCase()===key;})[0];
        if(dup){
          if(id){btn.disabled=false;toast('Another route already has this name.');return;}
          S.route=dup.id;S.open=null;closeSheet();render();toast('This route already exists. Opened it.');return;
        }
        if(id){await db.doc('routes/'+id).update({name:nm});}
        else{var rr=await db.collection('routes').add({name:nm,createdAt:today()});S.route=rr.id;render();}
        toast('Route saved');
      }else if(kind==='product'){
        var pn=g('p-name').replace(/\s+/g,' ');
        var pk=pn.toLowerCase();
        var pdup=S.products.filter(function(x){return x.id!==id&&String(x.name).trim().toLowerCase()===pk;})[0];
        if(pdup){btn.disabled=false;toast('This product is already in the list.');return;}
        var mv=parseFloat($('p-mrp').value);
        var pd={name:pn,type:g('p-type'),pack:g('p-pack'),composition:g('p-comp'),mrp:isNaN(mv)?'':r2(mv)};
        if(id){await db.doc('products/'+id).update(pd);}
        else{pd.createdAt=today();await db.collection('products').add(pd);}
        toast('Product saved');
      }else if(kind==='bulk'){
        var have={};S.products.forEach(function(x){have[String(x.name).trim().toLowerCase()]=1;});
        var add=[],skip=0;
        g('b-text').split(/\r?\n/).forEach(function(line){
          line=line.trim();if(!line)return;
          var pr=line.split(/\t|\||,/).map(function(x){return x.trim();});
          var nm2=pr[0].replace(/\s+/g,' ');if(!nm2)return;
          var k2=nm2.toLowerCase();if(have[k2]){skip++;return;}have[k2]=1;
          var pack='',mrp='';
          if(pr.length>=4){pack=pr[2];mrp=numOf(pr[3]);}
          else if(pr.length===3){if(isMoney(pr[2]))mrp=numOf(pr[2]);else pack=pr[2];}
          if(add.length<300)add.push({name:nm2.slice(0,80),type:(pr[1]||'').slice(0,40),pack:pack.slice(0,40),composition:(pr[4]||'').slice(0,300),mrp:mrp,createdAt:today()});
        });
        if(!add.length){btn.disabled=false;toast(skip?'All of these are already in the list.':'Nothing to add.');return;}
        for(var bi=0;bi<add.length;bi+=10){await Promise.all(add.slice(bi,bi+10).map(function(x){return db.collection('products').add(x);}));}
        toast('Added '+add.length+' product'+(add.length===1?'':'s')+(skip?', skipped '+skip+' already in the list':''));
      }else if(kind==='entry'){
        var amt=r2(parseFloat($('e-amt').value));
        if(!(amt>0)){btn.disabled=false;toast('Enter an amount greater than zero.');return;}
        var ed={doctorId:f.dataset.doc,kind:f.dataset.kind,amount:amt,date:g('e-date'),note:g('e-note')};
        if(id){await db.doc('ledger/'+id).update(ed);}
        else{ed.ts=Date.now();ed.mrId=S.myId||'';await db.collection('ledger').add(ed);}
        toast('Entry saved');
      }else if(kind==='visit'){
        var d=find(id),date=g('v-date'),samples=split(g('v-samp')),note=g('v-note');
        await db.collection('visits').add({doctorId:id,mrId:S.myId||'',date:date,samples:samples,note:note});
        var upd={};
        if(!d.lastVisit||date>=d.lastVisit){upd.lastVisit=date;upd.lastSamples=samples;}
        var np=split(g('v-prod'));
        if(np.length){var cur=(d.products||[]).slice();np.forEach(function(p){if(cur.indexOf(p)<0)cur.push(p);});upd.products=cur;}
        if(Object.keys(upd).length)await db.doc('doctors/'+id).update(upd);
        toast('Visit saved');
      }
      closeSheet();
    }catch(err){
      btn.disabled=false;
      toast(err&&err.code==='quota_exceeded'?'Storage is full.':'Could not save. You need edit access.');
    }
  });


  /* ---- Google Sheet backend (Apps Script web app). Shared by the whole team, polled every few seconds ---- */
  var SCRIPT_URL="https://script.google.com/macros/s/AKfycbzwIbokFw1YbAM8AUmnuvkaxn1bCc_LE5V7rllf_f5lVqGXWQdhRX5kqRPDpZ0MIT8O/exec";
  var KS='kalpilac-sheet-login-v1';
  var cache={},loaded=false,subs=[],role=null,akey='',uname='',uid='',pollT=null,lastSig='';
  var COLLS=['doctors','routes','products','visits','ledger','users'];
  COLLS.forEach(function(c){cache[c]={};});
  function post(body){
    body.key=akey;
    return fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
      .then(function(r){return r.json();})
      .catch(function(){throw {code:'unavailable'};})
      .then(function(j){if(!j.ok)throw {code:j.error||'failed'};return j;});
  }
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function notify(){subs.slice().forEach(function(f){f();});}
  function refresh(){
    return post({op:'all'}).then(function(j){
      var sig=JSON.stringify(j.data);
      if(sig!==lastSig||!loaded){lastSig=sig;COLLS.forEach(function(c){cache[c]=j.data[c]||{};});loaded=true;notify();}
    });
  }
  function startPoll(){
    clearInterval(pollT);
    pollT=setInterval(function(){if(!document.hidden)refresh().catch(function(){});},7000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh().catch(function(){});});
  }
  function snapOf(coll,flt,ord,lim){
    var rows=Object.keys(cache[coll]||{}).map(function(id){return {id:id,d:cache[coll][id]};});
    if(flt)rows=rows.filter(flt);
    if(ord)rows.sort(function(a,b){var x=a.d[ord.f],y=b.d[ord.f];var c=x<y?-1:x>y?1:0;return ord.dir==='desc'?-c:c;});
    if(lim)rows=rows.slice(0,lim);
    return {docs:rows.map(function(r){var body=clone(r.d);return {id:r.id,data:function(){return body;}};})};
  }
  function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  function sync(promise){return promise.then(function(r){refresh().catch(function(){});return r;},function(er){refresh().catch(function(){});throw er;});}
  function query(coll,flt,ord,lim){
    return {
      where:function(f,op,v){return query(coll,function(r){return r.d[f]===v;},ord,lim);},
      orderBy:function(f,dir){return query(coll,flt,{f:f,dir:dir||'asc'},lim);},
      limit:function(n){return query(coll,flt,ord,n);},
      get:function(){return refresh().then(function(){return snapOf(coll,flt,ord,lim);});},
      onSnapshot:function(next,errf){
        var run=function(){next(snapOf(coll,flt,ord,lim));};
        subs.push(run);if(loaded)setTimeout(run,0);
        return function(){subs=subs.filter(function(f){return f!==run;});};
      }
    };
  }
  var sdb={
    collection:function(name){
      var q=query(name);
      q.add=function(d){var id=newId();cache[name][id]=clone(d);notify();return sync(post({op:'set',coll:name,id:id,data:d})).then(function(){return {id:id};});};
      return q;
    },
    doc:function(path){
      var p=path.split('/'),coll=p[0],id=p[1];
      return {
        get:function(){var d=cache[coll]&&cache[coll][id];return Promise.resolve({exists:!!d,data:function(){return d;}});},
        set:function(d,o){cache[coll][id]=Object.assign((o&&o.merge&&cache[coll][id])||{},clone(d));notify();return sync(post({op:'set',coll:coll,id:id,data:d,merge:!!(o&&o.merge)}));},
        update:function(d){
          if(!cache[coll][id])return Promise.reject({code:'invalid_argument'});
          Object.assign(cache[coll][id],clone(d));notify();return sync(post({op:'update',coll:coll,id:id,data:d}));
        },
        delete:function(){delete cache[coll][id];notify();return sync(post({op:'delete',coll:coll,id:id}));}
      };
    }
  };
  function showLogin(msg,setup){
    $('login').hidden=false;
    if(setup){$('loginfields').hidden=true;$('loginsub').textContent='';$('loginmsg').textContent=msg;}
    else $('loginmsg').textContent=msg||'';
  }
  function slug(n){return 'u_'+n.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);}
  function waitForLogin(){
    return new Promise(function(resolve){
      if(SCRIPT_URL.indexOf('PASTE')===0){showLogin('This app is not connected to its Google Sheet yet. The owner needs to finish the setup.',true);return;}
      function enter(){
        $('login').hidden=true;uid=slug(uname);
        refresh().then(function(){startPoll();resolve(true);}).catch(function(er){S.err=(er&&er.code)||'unavailable';render();startPoll();resolve(true);});
      }
      function tryLogin(n,k,remember){
        akey=k;uname=n;
        return post({op:'auth'}).then(function(j){
          role=j.role;
          if(remember){try{localStorage.setItem(KS,JSON.stringify({n:n,k:k}));}catch(e){}}
          enter();
        });
      }
      var saved=null;try{saved=JSON.parse(localStorage.getItem(KS)||'null');}catch(e){}
      var auto=saved&&saved.n&&saved.k?tryLogin(saved.n,saved.k,false).catch(function(er){if(er&&er.code==='unavailable'){showLogin('No internet connection. Please try again.');}else{showLogin('');}}):(showLogin(''),null);
      $('loginform').addEventListener('submit',function(e){
        e.preventDefault();$('loginmsg').textContent='';
        tryLogin($('em').value.trim(),$('pw').value,true).catch(function(er){
          $('loginmsg').textContent=(er&&er.code==='auth')?'Wrong access key.':'Could not reach the server. Check the internet and try again.';
        });
      });
    });
  }
  function makeUser(){
    var owner=role==='owner';
    try{sdb.doc('users/'+uid).set({name:uname},{merge:true});}catch(e){}
    return {
      id:function(){return Promise.resolve(uid);},
      can:function(){return Promise.resolve(true);},
      isOwner:function(){return Promise.resolve(owner);},
      canEdit:function(){return Promise.resolve(owner);},
      profiles:function(ids){var o={};(ids||[]).forEach(function(i){var u=cache.users[i];o[i]={id:i,name:u?u.name:''};});o[uid]={id:uid,name:uname};return Promise.resolve(o);},
      owner:owner,name:uname
    };
  }
  function renderAcct(){
    var a=$('acct');if(!a||!user)return;
    a.innerHTML='<span>Signed in as '+esc(user.name)+(user.owner?' (owner)':'')+' · v14</span><span style="display:flex;gap:6px">'+
      '<button id="signout" type="button">Sign out</button></span>';
    $('signout').onclick=function(){try{localStorage.removeItem(KS);}catch(e){}location.reload();};
  }
  async function importBackup(file){
    if(!file)return;
    try{
      var j=JSON.parse(await file.text()),n=0;
      var names=['routes','doctors','products','visits','ledger'];
      for(var a=0;a<names.length;a++){var c=names[a],rows=j[c]||{};
        var ids=Object.keys(rows);
        for(var b=0;b<ids.length;b++){await sdb.doc(c+'/'+ids[b]).set(rows[ids[b]]);n++;}}
      toast('Imported '+n+' records');
    }catch(e){toast('Import failed: not a valid backup file');}
  }


  function pdfUrl(){try{return new URL('Kalpilac-Product-List.docx',location.href).href;}catch(e){return '';}}
  function waPdfLink(d){
    var n=waNumber(d.phone);if(!n)return '';
    var msg='Hello '+d.name+',\nPlease find the Kalpilac Pharmaceuticals product list here:\n'+pdfUrl();
    return '<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+n+'?text='+encodeURIComponent(msg)+'">Send product list</a>';
  }

  async function boot(){
    render();
    await waitForLogin();
    db=sdb;user=makeUser();renderAcct();
    S.showAll=true;
    if(user){try{S.myId=await user.id();var cw=await user.can('data.write');S.canWrite=cw!==false;S.isAdmin=!!(await user.isOwner())||!!(await user.canEdit());}catch(e){}}
    var timer=setTimeout(function(){if(!S.docsLoaded){S.slow=true;render();}},10000);
    db.collection('doctors').onSnapshot(function(snap){
      S.docs=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      S.docsLoaded=true;clearTimeout(timer);render();
    },function(er){S.err=(er&&er.code)||'unavailable';S.docsLoaded=true;render();});
    db.collection('routes').onSnapshot(function(snap){
      S.routes=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;}).sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
      S.routesLoaded=true;render();
    },function(er){S.routesLoaded=true;});
    db.collection('products').onSnapshot(function(snap){
      S.products=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      render();
    },function(er){});
    db.collection('ledger').onSnapshot(function(snap){
      S.ledger=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;o.amount=Number(o.amount)||0;return o;});
      render();
    },function(er){});
    db.collection('visits').orderBy('date','desc').limit(1000).onSnapshot(function(snap){
      S.visits=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      render();
    },function(er){});
  }
  boot();
})();
</script>
</body>
